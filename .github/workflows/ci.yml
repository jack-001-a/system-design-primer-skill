name: Validate and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Record OpenSSL version
        run: openssl version -a
      - name: Install evidence-signing dependency
        run: python -m pip install -r requirements-evidence-signing.txt
      - name: Validate Skill package
        run: python scripts/validate.py
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Bash syntax
        run: bash -n scripts/install.sh tests/test_install.sh
      - name: Test Bash installer
        run: bash tests/test_install.sh
      - name: Build and verify deterministic distribution
        run: |
          python tools/package.py --output-dir dist
          python tools/verify_package.py dist/system-design-primer-v$(tr -d '[:space:]' < VERSION).zip
      - name: Verify npm package contents
        run: |
          npm pack --dry-run --json > npm-pack.json
          python -c "import json; files={item['path'] for item in json.load(open('npm-pack.json', encoding='utf-8'))[0]['files']}; required={'evals/README.md','evals/system-design-cases.json','SKILL.md'}; missing=required-files; assert not missing, f'npm package missing: {sorted(missing)}'"
      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-design-primer-skill-linux
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS validation
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Record OpenSSL version
        run: openssl version -a
      - name: Install evidence-signing dependency
        run: python -m pip install -r requirements-evidence-signing.txt
      - name: Validate Skill package
        run: python scripts/validate.py
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Bash syntax
        run: bash -n scripts/install.sh tests/test_install.sh
      - name: Test Bash installer
        run: bash tests/test_install.sh

  windows:
    name: Windows validation
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Record OpenSSL version
        run: openssl version -a
      - name: Install evidence-signing dependency
        run: python -m pip install -r requirements-evidence-signing.txt
      - name: Validate Skill package
        run: python scripts/validate.py
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Test PowerShell installer
        shell: pwsh
        run: ./tests/test_install.ps1

  attest:
    name: Attest main-branch distribution
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: system-design-primer-skill-linux
          path: dist
      - name: Generate SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
