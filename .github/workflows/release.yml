name: Publish Skill release

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
          bash -n scripts/install.sh
          bash tests/test_install.sh
      - name: Determine release tag and target
        id: release_meta
        shell: bash
        run: |
          VERSION="v$(cat VERSION)"
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            test "$GITHUB_REF_NAME" = "release/$VERSION"
            echo "tag_name=$VERSION" >> "$GITHUB_OUTPUT"
            echo "target_commitish=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            test "$GITHUB_REF_NAME" = "$VERSION"
            echo "tag_name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "target_commitish=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build ZIP and checksums
        run: python tools/package.py --output-dir dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          target_commitish: ${{ steps.release_meta.outputs.target_commitish }}
          name: System Design Primer ${{ steps.release_meta.outputs.tag_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
