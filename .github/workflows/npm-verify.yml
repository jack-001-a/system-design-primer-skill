name: Verify npm publication

on:
  push:
    branches:
      - main
    paths:
      - ".github/npm-verify-trigger"

permissions:
  contents: read

jobs:
  verify:
    name: Verify public npm release
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check published version and latest tag
        shell: bash
        run: |
          package_name="system-design-primer-skill"
          expected="1.2.0"
          actual="$(npm view "$package_name@$expected" version)"
          latest="$(npm view "$package_name" dist-tags.latest)"
          test "$actual" = "$expected"
          test "$latest" = "$expected"
          echo "Verified public package: $package_name@$actual (latest=$latest)"
          echo "Tarball: $(npm view "$package_name@$expected" dist.tarball)"

      - name: Download and inspect public tarball
        shell: bash
        run: |
          npm pack system-design-primer-skill@1.2.0
          tar -tzf system-design-primer-skill-1.2.0.tgz > packed-files.txt
          grep -qx 'package/SKILL.md' packed-files.txt
          grep -qx 'package/references/12-ai-systems-architecture.md' packed-files.txt
          grep -qx 'package/templates/adr-template.md' packed-files.txt
          echo "Public npm tarball contains the Skill and required reference assets."
