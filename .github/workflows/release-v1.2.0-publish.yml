name: Publish v1.2.0 using verified CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-triggers/v1.2.0-publish"

permissions:
  contents: read

concurrency:
  group: release-publish-v1.2.0
  cancel-in-progress: false

jobs:
  validate:
    name: Release validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate Skill package
        run: python scripts/validate.py
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Test POSIX installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/install.sh tests/test_install.sh
          bash tests/test_install.sh
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_install.ps1

  publish:
    name: Build and publish v1.2.0
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify release version and ensure tag is unused
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "$version" = "1.2.0"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing tag $tag"
            exit 1
          fi
      - name: Build ZIP and checksums
        run: python tools/package.py --output-dir dist
      - name: Publish GitHub Release and create tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.2.0
          target_commitish: ${{ github.sha }}
          name: System Design Primer v1.2.0
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            dist/*.zip
            dist/*.sha256
